name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'

      - name: Read package version
        id: version
        shell: bash
        run: node -e "process.stdout.write('version=' + require('./package.json').version + '\\n')" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Tag does not match package.json version ($PKG_VERSION). Bump the package version before tagging."
            exit 1
          fi

  build:
    needs: validate
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Install Linux host compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Locate Windows host compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-Command g++.exe -ErrorAction SilentlyContinue
          if (-not $compiler) {
            $candidates = @('C:\mingw64\bin', 'C:\msys64\mingw64\bin', 'C:\msys64\ucrt64\bin')
            $compilerDirectory = $candidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'g++.exe') } | Select-Object -First 1
            if (-not $compilerDirectory) { throw 'A host g++ is required; refusing to skip firmware tests.' }
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $compilerDirectory
          }

      - name: Record host toolchain
        run: |
          node --version
          npm --version
          git --version
          g++ --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck desktop and backend
        run: npm run typecheck

      - name: Unit and real firmware integration tests
        run: npm test

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Build desktop application and bundled-tool installer
        run: npm run build

      - name: Build installers without publishing
        run: npx --no-install electron-builder --publish never

      - name: Preserve verified installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/${{ needs.validate.outputs.version }}/*.exe
            release/${{ needs.validate.outputs.version }}/*.dmg
            release/${{ needs.validate.outputs.version }}/*.AppImage
            release/${{ needs.validate.outputs.version }}/*.deb
            release/${{ needs.validate.outputs.version }}/*.blockmap
            release/${{ needs.validate.outputs.version }}/latest*.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  draft-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'

      - name: Download all successful platform installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Refuse to replace a published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-guard.cjs

      - name: Require every installer format
        shell: bash
        run: |
          for pattern in '*.exe' '*.dmg' '*.AppImage' '*.deb'; do
            if ! compgen -G "installers/$pattern" > /dev/null; then
              echo "::error::A required installer format is missing: $pattern"
              exit 1
            fi
          done

      # A single publisher runs only after every platform passed and packaged.
      # Maintainers publish the draft after install, signing, hardware and user validation.
      - name: Create draft for release validation
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installers/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
