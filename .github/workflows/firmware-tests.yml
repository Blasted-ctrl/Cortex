name: Firmware tests and benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Official GCC 14.2.0 Debian Bookworm image, immutable linux/amd64 manifest.
    # Pins the compiler, standard library, libc and build utilities together.
    container:
      image: gcc:14.2.0@sha256:82549aa8f90ada3236a8be70c74543132a76662ef33f0c3271ed802b81584a82
      options: --platform linux/amd64
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up exact Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Require the pinned host compiler
        run: g++ --version

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build desktop application
        run: npm run build

      - name: Run repeatable firmware scenarios
        run: npm run firmware:test -- --repeat 3 --report-dir .cortex/test-results

      - name: Verify broken firmware and watchdog
        run: npm run firmware:selftest

      - name: Benchmark host execution (advisory comparisons)
        run: npm run firmware:bench -- --runs 10 --baseline benchmarks/firmware-baseline.json --report-dir .cortex/benchmarks

      - name: Publish readable reports in the job summary
        if: always()
        run: node scripts/firmware-ci-summary.mjs

      - name: Upload scenario traces and benchmark reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cortex/test-results/
            .cortex/selftest-results/
            .cortex/benchmarks/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
