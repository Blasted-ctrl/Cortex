name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install Linux host compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
      - name: Locate Windows host compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-Command g++.exe -ErrorAction SilentlyContinue
          if (-not $compiler) {
            $candidates = @('C:\mingw64\bin', 'C:\msys64\mingw64\bin', 'C:\msys64\ucrt64\bin')
            $compilerDirectory = $candidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'g++.exe') } | Select-Object -First 1
            if (-not $compilerDirectory) { throw 'A host g++ is required; refusing to skip firmware tests.' }
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $compilerDirectory
          }
      - name: Record required host toolchain
        run: |
          node --version
          npm --version
          git --version
          g++ --version
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check dependency advisories
        run: npm audit --audit-level=high
